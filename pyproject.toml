[build-system]
requires = ["setuptools>=77", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "python-9p"
version = "0.1.0"
description = "Pythonic 9P2000 messages and client helpers backed by plan9port's C wire codec."
readme = "README.md"
requires-python = ">=3.10"
license = "MIT"
license-files = ["LICENSE"]
keywords = ["9p", "9p2000", "plan9", "filesystems"]
dependencies = []
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "Operating System :: POSIX :: Linux",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: System :: Filesystems",
]

[project.optional-dependencies]
test = ["pytest>=7.0", "hypothesis>=6.0"]
security = ["atheris>=3.0", "bandit>=1.7", "pip-audit>=2.7", "mutmut>=2.5"]
dev = ["ruff>=0.6"]

[project.urls]
Homepage = "https://github.com/kiljoy001/py-9p"
Repository = "https://github.com/kiljoy001/py-9p"
Issues = "https://github.com/kiljoy001/py-9p/issues"

[tool.setuptools.packages.find]
include = ["py9p*"]

[tool.setuptools.package-data]
py9p = ["libpy9p.so"]

[tool.pytest.ini_options]
addopts = "--import-mode=importlib"
testpaths = ["tests"]

[tool.ruff]
line-length = 100

[tool.ruff.lint]
ignore = ["PYI034"]

[tool.cibuildwheel]
build = "cp310-* cp311-* cp312-* cp313-*"
skip = "*-musllinux*"
archs = ["x86_64"]
manylinux-x86_64-image = "manylinux2014"
test-command = "python -c \"from py9p import Tversion, decode_message; assert decode_message(Tversion().to_bytes()).version == '9P2000'; print('wheel smoke OK')\""
